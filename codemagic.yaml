workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: 3.10.6
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Upgrade Android project
        script: flutter build apk --debug 2>/dev/null || true && flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: 3.10.6
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --no-codesign --debug
    artifacts:
      - build/ios/iphoneos/*.app

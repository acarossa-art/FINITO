workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: 3.10.6
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Migrate Android
        script: flutter create --platforms android .
      - name: Build Android
        script: flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
